cicl_version: "3"
foundation: elastic
apex_domain: "example.com"
observability_backend_url: "https://hyperdx.example.com"
domain_default_service: api.web

codebases:
  api:
    env:
      # api composes its own connection string from these parts at startup;
      # the identical magic refs work on both foundations (parts-only model).
      DATABASE_HOST: ${backing_services.appdb.host}
      DATABASE_PORT: ${backing_services.appdb.port}
      DATABASE_NAME: ${backing_services.appdb.db}
      DATABASE_USER: ${backing_services.appdb.user}
      DATABASE_PASSWORD: ${backing_services.appdb.password}
    core_services:
      web:
        role: web
        command: ["python", "/service/dist/app.py"]
        port: 8080
        networks: [web, internal]
        health_check_path: /health
        uses: [appdb]
        resources:
          cpu: 1.0
          memory: 2GB
          # Fargate's ephemeral_storage minimum is 21 GiB (decimal -> binary
          # rounding means at least ~23 GB at the CICL layer); below this
          # is a compile-time error. Omit to inherit Fargate's 21 GiB default.
          disk: 25GB

backing_services:
  appdb:
    role: relational_db
    engine: postgres
    version: "15"
    port: 5432
    networks: [internal]
    schema_owned_by: api
