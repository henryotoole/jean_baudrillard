cicl_version: "3"
foundation: elastic
apex_domain: "luxrnd.tech"
# The web *core service* on the bare <env>.<project>.<apex> subdomain.
# Dotted and fully qualified — a bare codebase name has no answer,
# because a codebase has no single boundary (cicl.md § Domain).
domain_default_service: api.web
# Default reverse_proxy on elastic per mod 044. Operator decision for
# the smoke project: ALB is the doctrine default — exercise it here.
# Switch to `ec2_traefik_eip` or `ec2_traefik_pip` only when smoke-
# walking that path explicitly.
reverse_proxy: alb
# container_registry omitted on elastic — defaults to the project ECR
# provisioned by `docex projinfra up production`. One repo per CODEBASE,
# so `api` gets exactly one regardless of how many core services it
# declares — the repo is keyed on the codebase, not on the core-service
# count. See cicl.md § Container Registry.
repo_url: "https://github.com/luxedo/jean_baudrillard"
# Project-wide observability backend (self-hosted HyperDX). Sidecars in
# stage/prod export OTLP signals here. See doctrine/infrastructure/
# specifics/telemetry_infra.md.
observability_backend_url: "https://hyperdx.luxrnd.tech"

codebases:
  # One codebase, one image, three core services. `web` and `worker` were two
  # separate codebases before CICL v2, purely because there was no way
  # to say "one artifact, two invocations" — they always shared a database,
  # a table, and six identical DATABASE_* refs. `clock` is the third
  # invocation of that same artifact and the reason the `reaper` codebase
  # no longer exists: a clock may only defer onto its OWN codebase's queue,
  # and `api` is the codebase that owns the schema
  # (clock.md § The clock defers; it does not work).
  api:
    # Codebase-scoped: all three core services run the same artifact and all
    # need a database, so these live once at the codebase level and merge
    # into every core service. (cicl.md § Field scoping.)
    env:
      # Built from appdb's provided parts at startup (parts-only model).
      # On elastic, DATABASE_HOST resolves to the RDS endpoint (HCL
      # pass-through) and USER/PASSWORD come from SSM via ECS secrets[].
      DATABASE_HOST: ${backing_services.appdb.host}
      DATABASE_PORT: ${backing_services.appdb.port}
      DATABASE_NAME: ${backing_services.appdb.db}
      DATABASE_USER: ${backing_services.appdb.user}
      DATABASE_PASSWORD: ${backing_services.appdb.password}
      DATABASE_SSLMODE: ${backing_services.appdb.sslmode}
    core_services:
      web:
        role: web
        command: ["python", "/service/dist/entrypoints/web.py"]
        port: 8080
        networks: [web, internal]
        # Declared so the ALB target group (on elastic) and the container
        # healthcheck (on fixed) point at /health rather than /. Routes
        # via the role's `health_check_path` field's `target: target_group`
        # translation on elastic.
        health_check_path: /health
        # ONE relation: bare entries name backing services, the dotted entry
        # names a core service. `api.web` proxies the worker's liveness at
        # /health/api/worker and therefore speaks to that boundary. One
        # direction only — this worker polls a table and never calls the web
        # edge, so the reverse edge would be a false declaration.
        # (cicl.md § Uses Relationships.)
        uses: [appdb, probe, events, api.worker]
        env:
          # Core-service-scoped: only the web edge exposes /health/{probe,events},
          # so only it declares these refs — which is what keeps `probe` and
          # `events` out of the worker's `uses`. Per rule 7 a
          # CODEBASE-level ref would oblige EVERY core service to declare the
          # edge, forcing the worker to declare backings it never touches.
          #
          # Project-local container backings: nginx sidecar + ClickHouse
          # analytics_db. On elastic, the hosts resolve via ECS Service
          # Connect's per-env private DNS namespace.
          SIDECAR_HOST: ${backing_services.probe.host}
          SIDECAR_PORT: ${backing_services.probe.port}
          CLICKHOUSE_HOST: ${backing_services.events.host}
          CLICKHOUSE_PORT: ${backing_services.events.port}
          # Five-segment core magic refs — the worker's Service Connect
          # address, used by the /health/api/worker fan-out. Holding these
          # refs is what obliges the `api.worker` entry in `uses:` above.
          WORKER_HOST: ${codebases.api.core_services.worker.host}
          WORKER_PORT: ${codebases.api.core_services.worker.port}
        resources:
          cpu: 0.25
          memory: 512MB
          # Fargate ephemeral_storage minimum is 21 GiB; CICL accepts decimal
          # GB so 25GB is a safe floor that satisfies the minimum after
          # decimal->binary rounding.
          disk: 25GB

      worker:
        role: worker
        command: ["python", "/service/dist/entrypoints/worker.py"]
        # A port purely for the liveness probe: a worker is never an ingress
        # target and gets no ALB exposure, but a core `uses` target must be
        # probeable — and on elastic the port is exactly what makes it
        # Service-Connect-discoverable, which is what lets the sibling `web`
        # core service reach its /health one hop away.
        port: 8081
        health_check_path: /health
        networks: [internal]
        uses: [appdb]
        # Honoured in `prod` only — clamped to 1 in dev/test/stage. Puts a
        # real `desired_count = 2` through `tofu validate` in prod.
        replicas: 2
        resources:
          cpu: 0.25
          memory: 512MB
          disk: 25GB

      # The clock: an ordinary long-running singleton core service whose
      # `command` invokes the cron loop — a `task_definition` + `ecs_service`
      # here, exactly like its siblings, with NO target group. It DEFERS and
      # does not work: each fire enqueues a row onto the `jobs` table that
      # `api.worker` drains (clock.md § The clock defers; it does not work).
      clock:
        role: clock
        command: ["python", "/service/dist/entrypoints/clock.py"]
        # `port` + `health_check_path` with NOTHING routed to it. A clock
        # takes no ingress (rule 27 forbids `web` in its networks) and
        # nothing `uses` it, so no health fan-out reaches it either — its
        # /health is enforced by the CONTAINER HEALTHCHECK alone (ECS
        # container health here, docker `healthcheck:` on fixed). That is
        # real enforcement — a wedged clock gets its task killed and
        # replaced — but it is local: staging tests cannot reach it.
        # (clock.md § Caveats.)
        port: 8082
        health_check_path: /health
        networks: [internal]
        # `api.worker` holds NO magic ref. The clock reaches the worker
        # through the `jobs` table, not the mesh, so there is no host to
        # reference; the edge exists to declare the interface. A ref implies
        # an edge, never the reverse (cicl.md § Three clarifications).
        uses: [appdb, api.worker]
        # Bare 5-field UTC cron, passed through to the clock verbatim — no
        # dialect translation anywhere, because the clock is project code
        # rather than a cloud primitive (clock.md § Cron format).
        schedules:
          # The retired `reaper.prune`'s work, on its original schedule.
          prune_pings: "0 3 * * *"
          # Minutely SO THE WALK CAN OBSERVE the fire → defer → drain path
          # inside a realistic window. Without it that path is unobservable
          # and the cron loop is never seen firing anything.
          heartbeat:   "* * * * *"
        # No `replicas` — forbidden on a clock (rule 26). It is a singleton,
        # and on elastic it deploys stop-then-start
        # (deployment_minimum_healthy_percent = 0 / maximum = 100) so a
        # rolling deploy cannot briefly run two tasks and double-fire.
        resources:
          cpu: 0.25
          memory: 512MB
          disk: 25GB

backing_services:
  # `appdb` rather than `db`: postgres engine reserves DBName values
  # like `db`, `database`, `postgres` etc., so a service named `db`
  # would fail RDS provisioning when the engine's `provides.db = ${name}`
  # flows into RDS's `db_name` parameter. The fixed companion uses the
  # same name so core code stays foundation-agnostic.
  appdb:
    role: relational_db
    engine: postgres
    version: "15"
    networks: [internal]
    # Names a CODEBASE, never a core service — `migrate.sh` runs once per
    # codebase, not once per invocation.
    schema_owned_by: api

  # Project-local engines declared at infra/transfer_tables/{sidecar,clickhouse}.yml.
  # `probe` is stateless (sidecar/nginx); `events` is stateful
  # (analytics_db/clickhouse) with persistent_storage and project-opt-in
  # backups.
  probe:
    role: sidecar
    engine: nginx
    networks: [internal]

  events:
    role: analytics_db
    engine: clickhouse
    networks: [internal]
    # Opt in to AWS Backup for ClickHouse data. Default disabled — only
    # the project knows whether the data is replaceable cache or
    # irreplaceable user state.
    backups: true
