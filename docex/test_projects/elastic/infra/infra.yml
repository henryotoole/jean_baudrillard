cicl_version: "1"
foundation: elastic
domain: "doctrine-elastic.luxrnd.tech"
domain_default_service: web
# container_registry omitted on elastic — defaults to the project ECR
# provisioned by `docex bootstrap`. See cicl.md § Container Registry.
repo_url: "https://github.com/luxedo/jean_baudrillard"
# Project-wide observability backend (self-hosted HyperDX). Sidecars in
# stage/prod export OTLP signals here. See doctrine/infrastructure/
# specifics/telemetry_infra.md.
observability_backend_url: "https://hyperdx.luxrnd.tech"

core_services:
  web:
    role: web
    port: 8080
    networks: [web, internal]
    # Declared so the ALB target group (on elastic) and the container
    # healthcheck (on fixed) point at /health rather than /. Routes
    # via mod 010's `target: target_group` translation on elastic.
    health_check_path: /health
    depends_on: [appdb, probe, events]
    env:
      # Built from db's provided parts at startup (parts-only model).
      # On elastic, DATABASE_HOST resolves to the RDS endpoint and
      # USER/PASSWORD come from SSM via ECS secrets[].
      DATABASE_HOST: ${backing_services.appdb.host}
      DATABASE_PORT: ${backing_services.appdb.port}
      DATABASE_NAME: ${backing_services.appdb.db}
      DATABASE_USER: ${backing_services.appdb.user}
      DATABASE_PASSWORD: ${backing_services.appdb.password}
      DATABASE_SSLMODE: ${backing_services.appdb.sslmode}
      # Project-local container backings introduced for the docex 0.10.0
      # campaign smoke walk: nginx sidecar + ClickHouse analytics_db.
      # On elastic, the hosts resolve via ECS Service Connect's namespace.
      SIDECAR_HOST: ${backing_services.probe.host}
      SIDECAR_PORT: ${backing_services.probe.port}
      CLICKHOUSE_HOST: ${backing_services.events.host}
      CLICKHOUSE_PORT: ${backing_services.events.port}
    resources:
      cpu: 0.25
      memory: 512MB
      # Fargate ephemeral_storage minimum is 21 GiB; CICL accepts decimal
      # GB so 25GB is a safe floor that satisfies the minimum after
      # decimal->binary rounding.
      disk: 25GB

  worker:
    role: web
    # No port — `worker` isn't on the web network, so no ALB exposure.
    networks: [internal]
    depends_on: [appdb]
    env:
      DATABASE_HOST: ${backing_services.appdb.host}
      DATABASE_PORT: ${backing_services.appdb.port}
      DATABASE_NAME: ${backing_services.appdb.db}
      DATABASE_USER: ${backing_services.appdb.user}
      DATABASE_PASSWORD: ${backing_services.appdb.password}
      DATABASE_SSLMODE: ${backing_services.appdb.sslmode}
    resources:
      cpu: 0.25
      memory: 512MB
      disk: 25GB

backing_services:
  # Service name chosen to avoid RDS reserved-DBName collision: "db",
  # "database", "postgres", etc. are rejected by RDS as DBName values
  # for the postgres engine. The service name flows into both the RDS
  # identifier and the initial database name (the postgres engine's
  # `db` provided part = ${name}).
  appdb:
    role: relational_db
    engine: postgres
    version: "15"
    networks: [internal]
    schema_owned_by: web

  # Project-local engines declared at infra/transfer_tables/{sidecar,clickhouse}.yml.
  # See the doctrine's transfer_tables.md § Authoring Project-Local Transfer Tables
  # for the schema. probe is stateless (sidecar/nginx); events is stateful
  # (analytics_db/clickhouse) with persistent_storage and project-opt-in backups.
  probe:
    role: sidecar
    engine: nginx
    networks: [internal]

  events:
    role: analytics_db
    engine: clickhouse
    networks: [internal]
    # Opt in to AWS Backup for ClickHouse data. Default disabled — only the
    # project knows whether the data is replaceable cache or irreplaceable
    # user state. (Mod 015's project-opt-in field-routed via target_extras.)
    backups: true
