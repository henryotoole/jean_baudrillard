# The `events` surface of the `api.worker` core service.
#
# Why this file exists: `api.worker` declares
# `surfaces: {events: {api_styles: [events]}}` in infra.yml, and a declared
# surface must have a contract. The FORMAT follows from that surface's
# `api_styles` — `events` → asyncapi — and NOT from the core service's `role`
# (cicl.md § Surfaces). A `worker` that declared a `rest` surface would get an
# OpenAPI document; the role decides nothing here.
#
# This is ONE of TWO surfaces this core service declares. This one describes
# the queues it CONSUMES; its request/reply boundary is a separate surface in
# api.worker.rpc.asyncapi.yml, because the two have unrelated consumer sets.
# Its liveness is a container probe (`./health.sh worker`) that no contract
# describes and that nothing outside the orchestrator reads.
#
# Both queues live in this ONE document, per cicl.md § Surfaces' split table:
# "a worker consuming two different queues — one core service, one surface;
# one AsyncAPI document carries both channels."
#
# ---------------------------------------------------------------------
# A known loose end, recorded rather than hidden.
#
# AsyncAPI naturally describes a broker: a channel on a message bus, with
# send/receive operations. This worker has no broker. The doctrine ships no
# `queue` role, so its "queues" are the `pings` and `jobs` TABLES in the
# `appdb` relational_db, polled once a second. That is a legitimate shape
# — and the honest channel address for it is a table name, not a topic.
#
# It remains the most visible loose end in this area: the doctrine ships a
# first-class `worker` role with no first-class thing for it to consume. The
# channels below are described as they actually are.
# ---------------------------------------------------------------------

asyncapi: "3.0.0"
info:
  title: docex_smoke_elastic.api.worker
  version: "0.0.1"
  description: |
    Test-project worker core service for the doctrine smoke test. Claims
    unprocessed pings from the `pings` table in batches, marks each
    processed, and repeats. Shares its codebase, image, and database with
    the `api.web` core service.

defaultContentType: application/json

channels:
  pings:
    address: pings
    description: |
      The work queue, which is a postgres table rather than a broker topic
      (see the header). `api.web` appends a row per POST /pings; this
      core service claims rows where `processed_at IS NULL`, oldest first,
      in batches of 32, and stamps `processed_at` on success.

      Address is the table name because that is the truth. A broker-backed
      worker would put a topic here instead and nothing else in this file
      would change.
    messages:
      ping:
        name: Ping
        title: A ping awaiting processing
        contentType: application/json
        payload:
          type: object
          required: [id, payload, created_at]
          properties:
            id:
              type: string
              format: uuid
              description: Primary key, assigned by `api.web` on enqueue.
            payload:
              type: string
              minLength: 1
              description: Opaque body supplied by the POST /pings caller.
            created_at:
              type: string
              format: date-time
              description: Enqueue time, UTC. Claim order is oldest first.
            processed_at:
              type: ["string", "null"]
              format: date-time
              description: >
                Null while unprocessed; stamped by this core service on a
                successful pass. Also the retention key that `api.clock`'s
                `prune_pings` job prunes against — deferred by the clock,
                performed by this core service.

  jobs:
    address: jobs
    description: |
      The deferred-job queue, which like `pings` above is a postgres TABLE
      rather than a broker topic (see the header). `api.clock` appends one
      row per cron fire — it defers and never performs
      (clock.md § The clock defers; it does not work) — and this core
      service claims rows where `started_at IS NULL`, oldest first, in
      batches of 8.

      Claimed with `SELECT ... FOR UPDATE SKIP LOCKED` inside one
      transaction, which is what makes `replicas: 2` safe: no job is ever
      claimed twice. That same guarantee is what makes this core service's
      `rpc` surface safe to serve concurrently with this loop — see
      api.worker.rpc.asyncapi.yml. The same jobs can also be deferred by hand
      over HTTP on `api.web` (`POST /jobs/*`), because the clock and the HTTP
      edge share one driving port.
    messages:
      job:
        name: Job
        title: A job awaiting performance
        contentType: application/json
        payload:
          type: object
          required: [id, name, enqueued_at]
          properties:
            id:
              type: string
              format: uuid
              description: Primary key, assigned on enqueue.
            name:
              type: string
              description: >
                The dispatch key. Must match an entry in this core
                service's perform-side handler table; an unknown name is
                recorded as a failure on the row rather than crashing the
                drain.
              enum: [prune_pings, heartbeat]
            enqueued_at:
              type: string
              format: date-time
              description: Defer time, UTC. Claim order is oldest first.
            started_at:
              type: ["string", "null"]
              format: date-time
              description: Null until claimed; stamped by the claim itself.
            finished_at:
              type: ["string", "null"]
              format: date-time
              description: Null until the handler returns or raises.
            error:
              type: ["string", "null"]
              description: >
                Null on success; the handler's failure message otherwise. A
                failed job does not stall the ones behind it.

# AsyncAPI 3.0 lifts operations out of `channels` into their own top-level
# block, which is the structural half of the 2.6 -> 3.0 move. `action: receive`
# is this core service's side of both channels: it consumes, and it publishes
# to neither.
operations:
  consumePing:
    action: receive
    summary: Claim and process one unprocessed ping.
    channel:
      $ref: '#/channels/pings'
    messages:
      - $ref: '#/channels/pings/messages/ping'

  performJob:
    action: receive
    summary: Claim and perform one deferred job.
    channel:
      $ref: '#/channels/jobs'
    messages:
      - $ref: '#/channels/jobs/messages/job'
