# OpenAPI contract for the `web` service.
#
# docex check's contract gate verifies that paths declared here exist in
# the running web service (provider-side contract testing).
#
# Health-endpoint rules (doctrine/infrastructure/contracts.md § Health Checks):
#   - GET /health is mandatory for any service on the `web` network.
#   - Per-depends_on /health/<other> sub-endpoints are required only when
#     the dependency is a *core service* downstream in web's chain.
#
# /health/probe and /health/events below are NOT required by the
# doctrine (probe and events are backing services, not core services).
# They're declared here because the campaign-end smoke walk uses them
# to assert that Service Connect + EFS-backed ClickHouse + sidecar are
# all wired up correctly.

openapi: "3.0.3"
info:
  title: docex_smoke_elastic.web
  version: "0.0.1"
  description: |
    Test-project web service for the doctrine smoke test. POST a payload
    to /pings, the worker picks it up via postgres. /health/{probe,events}
    exercise the project-local sidecar + analytics_db backings.
servers:
  - url: "https://docex-smoke-elastic.luxrnd.tech"
    description: prod (bare-project, domain_default_service)
  - url: "https://web.prod.docex-smoke-elastic.luxrnd.tech"
    description: prod (canonical per-service host)
  - url: "https://stage.docex-smoke-elastic.luxrnd.tech"
    description: stage (bare-env)
  - url: "https://web.stage.docex-smoke-elastic.luxrnd.tech"
    description: stage (canonical per-service host)

paths:
  /health:
    get:
      summary: Service liveness.
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    example: "0.0.1"

  /health/probe:
    get:
      summary: Probe sidecar reachability over the internal network.
      operationId: healthProbe
      responses:
        "200":
          description: probe reachable
          content:
            application/json:
              schema:
                type: object
                required: [reachable]
                properties:
                  reachable:
                    type: string
                    example: "true"
                  status_code:
                    type: integer
        "503":
          description: probe unreachable

  /health/events:
    get:
      summary: ClickHouse (analytics_db backing) TCP reachability.
      operationId: healthEvents
      responses:
        "200":
          description: events backing reachable
          content:
            application/json:
              schema:
                type: object
                required: [reachable]
                properties:
                  reachable:
                    type: string
                    example: "true"
                  port:
                    type: integer
        "503":
          description: events backing unreachable

  /pings:
    post:
      summary: Enqueue a ping for the worker to process.
      operationId: createPing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          description: Invalid payload
