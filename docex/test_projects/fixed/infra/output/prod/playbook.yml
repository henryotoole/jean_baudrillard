---
# Generated by `docex compile`. Do not edit by hand.
# project: docex_smoke_fixed v0.0.1
# env: prod
- name: Deploy docex_smoke_fixed prod
  hosts: prod
  become: true
  vars:
    project: "docex_smoke_fixed"
    env: "prod"
    version: "0.0.1"
    deploy_root: "/opt/docex_smoke_fixed/prod"
  tasks:
    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_root }}"
        state: directory
        mode: "0750"

    - name: Render docker-compose.yml onto host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../prod/docker-compose.yml"
        dest: "{{ deploy_root }}/docker-compose.yml"
        mode: "0640"

    - name: Render .env onto host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../secrets/prod.env"
        dest: "{{ deploy_root }}/.env"
        mode: "0600"

    - name: Pull all images
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_root }}"
        pull: always
        state: present

    - name: Run migrations for web
      community.docker.docker_container:
        name: "{{ project }}_{{ env }}_web_migrate"
        image: "registry.luxrnd.tech/docex_smoke_fixed/web:0.0.1"
        command: /service/migrate.sh
        networks:
          - name: "{{ project }}_{{ env }}_internal"
        env_file: "{{ deploy_root }}/.env"
        detach: false
        auto_remove: true
      tags:
        - migrate

    - name: Bring up the stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_root }}"
        state: present
        remove_orphans: true
