# project: docex_smoke_fixed v0.0.23
# env: prod
- name: Deploy docex_smoke_fixed prod
  hosts: prod
  become: true
  vars:
    project: "docex_smoke_fixed"
    env: "prod"
    version: "0.0.23"
    deploy_root: "/opt/docex_smoke_fixed/prod"
  tasks:
    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_root }}"
        state: directory
        mode: "0750"

    - name: Render docker-compose.yml onto host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../prod/docker-compose.yml"
        dest: "{{ deploy_root }}/docker-compose.yml"
        mode: "0640"

    - name: Render TTE store onto host
      ansible.builtin.copy:
        src: "{{ tte_store_file }}"
        dest: "{{ deploy_root }}/tte.env"
        mode: "0600"
      # Skipped in dry-run (--check passes no extra-vars); the real release
      # always supplies tte_store_file. Mod 093.
      when: tte_store_file is defined

    - name: Render .env onto host
      ansible.builtin.copy:
        src: "{{ agg_env_file }}"
        dest: "{{ deploy_root }}/.env"
        mode: "0600"
      # Skipped in dry-run (--check passes no extra-vars); the real release
      # always supplies agg_env_file. Mod 093.
      when: agg_env_file is defined

    - name: Pull all images
      community.docker.docker_compose_v2_pull:
        project_src: "{{ deploy_root }}"
        project_name: "docex-smoke-fixed-prod"
        policy: always

    - name: Run migrations for api
      ansible.builtin.command:
        cmd: docker compose -p docex-smoke-fixed-prod run --rm docex-smoke-fixed-prod-api-exec /service/migrate.sh
        chdir: "{{ deploy_root }}"
      register: api_migrate_result
      changed_when: true
      tags:
        - migrate

    - name: Bring up the stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_root }}"
        project_name: "docex-smoke-fixed-prod"
        state: present
        remove_orphans: true
