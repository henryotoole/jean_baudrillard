[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docex"
version = "2.2.0"
description = "The executor of the doctrine."
readme = "plans/core/masterplan.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "jinja2>=3",
    "rich>=13",
    # Phase 4: boto3 is the *only* dependency permitted to import
    # boto3/botocore — see src/docex/aws/boto3_client.py. Pin the
    # 1.34.x line current as of docex 0.4.0; bump in step with the
    # AWS SDK release cadence.
    "boto3==1.34.144",
    "botocore==1.34.144",
    # Mod 054: public-DNS resolution for the development-side preinfra
    # check. The *only* dependency permitted to import dns/dnspython —
    # see src/docex/dns/dnspython_resolver.py. Chosen over stdlib
    # getaddrinfo because it queries configured nameservers and ignores
    # /etc/hosts, so the check sees what Let's Encrypt sees.
    "dnspython>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
docex = "docex.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"docex" = ["emit/templates/*.j2"]

[tool.pytest.ini_options]
# Phase 2: skip integration tests by default. They require real docker
# and bring up real containers; the implementer runs them explicitly
# via `pytest -m integration` after the unit tests pass.
addopts = "-m 'not integration'"
markers = [
    "integration: requires a real docker daemon; skipped by default",
]
# Don't recurse into the on-disk fixtures — they may carry their own
# tests/ dirs (e.g. core/<svc>/tests, infra/stage/tests) that share
# basenames across services and confuse pytest's importmode.
testpaths = ["tests"]
norecursedirs = ["fixtures", "__pycache__", "infra/output"]
# Mod 119: keep a test's tmp tree only when it fails. Integration tests
# download ~676 MB of OpenTofu AWS provider per copy and pytest retains the
# last 3 run roots, so "keep everything" is ~18 GB of steady state. The
# retention given up is for *passing* tests, which nobody inspects; a
# failing test keeps its whole tree (and `_reclaim_root_owned_residue`
# chowns it so it is readable). To get a green run's tree back for
# debugging: `pytest --tmp-path-retention-policy=all`.
tmp_path_retention_policy = "failed"
