# Generated and maintained by the doctrine. Defines the canonical set of
# AWS-resource-type naming policies the compiler applies anywhere a project
# / env / service name is interpolated into an identifier.
#
# Each policy describes:
#   separator: underscore | hyphen  -- character used to join name parts;
#                                      also the form internal underscores
#                                      get translated to (hyphen) or
#                                      preserved as (underscore).
#   case:      any | lower          -- whether to lowercase the result.
#   max_len:   <int>                -- optional ceiling; compile errors if
#                                      the rendered name is longer.
#
# Default rule: anything name-resolvable on the data plane uses hyphens
# (Docker containers/networks/volumes, ECS cluster/service/task-def/
# Service Connect, ALB/target groups, RDS, S3, hostnames). Underscores
# are preserved only for inert AWS record-key identifiers that
# applications never name in DNS or compose: IAM roles, SSM path
# segments, DynamoDB tables.

naming_policies:
  # S3 bucket names: lowercase, hyphens only.
  s3:
    separator: hyphen
    case: lower
    max_len: 63

  # RDS instance identifier / DB subnet group: lowercase, hyphens only.
  rds:
    separator: hyphen
    case: lower
    max_len: 63

  # DynamoDB tables — inert record-key identifier; preserve underscores.
  ddb:
    separator: underscore
    case: any
    max_len: 255

  # ALB and target-group names: hyphens only, 32-char ceiling.
  alb:
    separator: hyphen
    case: any
    max_len: 32

  # ECS cluster / service / task-definition family / Service Connect:
  # data-plane resolvable, hyphens.
  ecs:
    separator: hyphen
    case: any
    max_len: 255

  # IAM role / policy names — inert AWS record-key identifier; preserve
  # underscores.
  iam:
    separator: underscore
    case: any
    max_len: 64

  # SSM parameter path segments — inert AWS record-key identifier;
  # preserve underscores (matches the `.env` key naming).
  ssm_path:
    separator: underscore
    case: any
    max_len: 1024

  # Docker network/container/volume names: data-plane resolvable,
  # hyphens.
  docker:
    separator: hyphen
    case: any

  # DNS labels (hostnames): hyphens only, lowercase.
  http_host:
    separator: hyphen
    case: lower
