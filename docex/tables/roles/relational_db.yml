# Role: relational_db
#
# Canonical relational database backing service. On fixed, runs as a
# postgres container with a named volume. On elastic, provisioned as
# an AWS RDS instance. See transfer_tables.md § "Walking example:
# relational_db / postgres".
#
# Phase 4 elastic translation notes:
#   - The `username` and `password` fields below carry `$[POSTGRES_USER]`
#     / `$[POSTGRES_PASSWORD]`. Resolution now depends on the env var's
#     `kind` (see the `env:` block): `POSTGRES_USER` is `kind: fixed`, so
#     the compiler inlines its literal `value` (appuser) at each site and
#     it never reaches SSM. Only `minted`/`secret` vars — here just
#     `POSTGRES_PASSWORD` — are translated into a `data "aws_ssm_parameter"`
#     block referencing /<project>/<env>/POSTGRES_PASSWORD. The release
#     flow's SSM push step guarantees those parameters exist before tofu
#     apply. (The `fixed`-inlining emitter change lands in Mod 077; today
#     the emitter still SSM-sources every `$[…]` token.)
#   - The `host` provides template uses `@aws_db_instance.${name}.address`
#     (hostname only, no port) so consumers reading
#     `${backing_services.<db>.host}` can compose `host:port` themselves
#     without the malformed `host:port:port` that `.endpoint` produces.

roles:
  relational_db:
    description: "Relational database backing service."
    postgres:
      foundation: both
      default_port: 5432
      emits:
        fixed: [compose_service]
        elastic: [rds_instance]
      # Names RDS rejects as DBName for a postgres engine, plus the
      # postgres SQL-standard reserved keyword set the operator is
      # most likely to trip on when naming a backing service after a
      # generic concept ("database", "user", "admin"). Validation is
      # case-insensitive. If your project needs one of these as a
      # display name, alias around it (e.g. service name `app_db`).
      reserved_names:
        # Common RDS/admin collisions:
        - admin
        - database
        - db
        - master
        - postgres
        - public
        - rdsadmin
        - root
        - template0
        - template1
        # SQL-standard reserved keywords that postgres also reserves:
        - all
        - analyse
        - analyze
        - and
        - any
        - array
        - as
        - asc
        - asymmetric
        - both
        - case
        - cast
        - check
        - collate
        - column
        - constraint
        - create
        - current_catalog
        - current_date
        - current_role
        - current_time
        - current_timestamp
        - current_user
        - default
        - deferrable
        - desc
        - distinct
        - do
        - else
        - end
        - except
        - 'false'
        - fetch
        - for
        - foreign
        - from
        - grant
        - group
        - having
        - in
        - initially
        - intersect
        - into
        - lateral
        - leading
        - limit
        - localtime
        - localtimestamp
        - not
        - 'null'
        - offset
        - 'on'
        - only
        - or
        - order
        - placing
        - primary
        - references
        - returning
        - select
        - session_user
        - some
        - symmetric
        - table
        - then
        - to
        - trailing
        - 'true'
        - union
        - unique
        - user
        - using
        - variadic
        - when
        - where
        - window
        - with
      defaults:
        fixed:
          volumes:
            - ${global_service_name}_data:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $[POSTGRES_USER] -d ${name}"]
            interval: 10s
            timeout: 5s
            retries: 5
          environment:
            POSTGRES_USER: $[POSTGRES_USER]
            POSTGRES_PASSWORD: $[POSTGRES_PASSWORD]
            POSTGRES_DB: ${name}
        elastic:
          engine: "postgres"
          instance_class: "db.t3.medium"
          allocated_storage: 20
          storage_encrypted: false
          publicly_accessible: false
          backup_retention_period: 7
          deletion_protection: true
          storage_type: "gp3"
          username: $[POSTGRES_USER]
          password: $[POSTGRES_PASSWORD]
          db_name: ${name}
      fields:
        version:
          fixed:
            image: postgres:${field_value}
          elastic:
            engine_version: ${field_value}
      provides:
        host:
          fixed: "${global_service_name}"
          elastic: "@aws_db_instance.${name}.address"
        port:
          fixed: "${port}"
          elastic: "${port}"
        db:
          fixed: "${name}"
          elastic: "${name}"
        user:
          fixed: "$[POSTGRES_USER]"
          elastic: "$[POSTGRES_USER]"
        password:
          fixed: "$[POSTGRES_PASSWORD]"
          elastic: "$[POSTGRES_PASSWORD]"
        sslmode:
          fixed: "disable"
          elastic: "require"
      env:
        POSTGRES_USER:
          kind: fixed
          value: appuser
          desc: "Postgres role name — doctrine-fixed, not a secret."
        POSTGRES_PASSWORD:
          kind: minted
          policy: password
          desc: "Postgres role password — generated once per env."
      # RDS forbids underscores in identifiers; the `rds` policy is hyphen +
      # lower + 63 chars. See tables/naming_policies.yml § rds.
      naming: rds
