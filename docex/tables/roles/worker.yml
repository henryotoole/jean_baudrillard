# Role: worker
#
# Core-service role — long-running, event-driven, never publicly
# routed. Canonically a queue consumer; a stream processor or polling loop
# fits the same shape. Shares its codebase and image with sibling core
# services.
#
#   - fixed:   one compose service on the codebase's image with the core
#              service's `command`.
#   - elastic: task_definition + ecs_service. NO target_group — a worker is
#              not an ingress target.
#
# `cpu:`, `memory:`, `tmpfs:` are derived per-core-service by the
# compiler, exactly as for `web`; `image:` is derived per codebase, so
# every core service of a codebase runs one tag.

roles:
  worker:
    description: "Core-service role — long-running, event-driven, not publicly routed."
    container:
      foundation: both
      emits:
        fixed: [compose_service]
        elastic: [task_definition, ecs_service, container_definition]
      defaults:
        # The container probe is a DEFAULT, not a field: `health.sh` is
        # emitted for every core service on both foundations and needs
        # nothing from infra.yml but the service's own name. Cadence is
        # doctrine-fixed and uniform across every core service — it is not a
        # project-tunable knob. See healthchecks.md § The orchestrator
        # carries the result.
        #
        # This is how a worker gets a probe at all. It declares no
        # `health_check_path` — rule 33 confines that field to `web`-network
        # core services — and a long-running consume loop's liveness is a
        # loop-tick question, not an HTTP-route question.
        fixed:
          healthcheck:
            test: ["CMD", "./health.sh", "${service}"]
            interval: 30s
            timeout: 5s
            retries: 3
        elastic:
          # `CMD`, not `CMD-SHELL`: a command probe needs no shell and no
          # `|| exit 1` exit-code laundering. Exec form on both foundations is
          # what makes the two emissions one translation rather than two
          # adaptations. `./health.sh` resolves against WORKDIR /service,
          # which infrastructure.md § Codebase Containers fixes for every
          # codebase image.
          #
          # `startPeriod` is elastic-only ON PURPOSE. ECS KILLS a task whose
          # essential container fails its probe and the service replaces it —
          # a wedged consume loop gets the task killed and replaced — so a
          # start grace prevents a container being killed before it has
          # written its first tick. Docker only REPORTS `unhealthy`; nothing
          # on fixed acts on it, so a fixed `start_period` would suppress
          # correct behavior rather than prevent a wrong consequence.
          healthCheck:
            command: ["CMD", "./health.sh", "${service}"]
            interval: 30
            timeout: 5
            retries: 3
            startPeriod: 10
      fields: {}   # Rule 4 (tt_rule_4_undeclared_field) REJECTS
                   # `health_check_path` on a worker, which enforces rule 33's
                   # negative arm at the table layer FOR THIS ROLE. It does not
                   # enforce the whole arm: a `role: web` core service off the
                   # `web` network declares the field legally per its own engine,
                   # and only `cicl/validate.py`'s dedicated
                   # `rule_33_health_check_path_off_web` catches that. Rule 33
                   # keys on network membership, not role.
                   #
                   # NOT the same mechanism clock.yml documents for `schedules`:
                   # `schedules` is declared on no other role, so there is no
                   # legal-declaration case for a second rule to catch and rule 4
                   # really is the whole story there.
      provides:
        # A worker that declares a `port` registers as Service-Connect-
        # discoverable on elastic (shape.md § service_discovery), which is what
        # lets a consumer holding a magic ref to this worker's `host`/`port`
        # parts actually address it — rule 32's positive arm.
        host:
          fixed: "${global_service_name}"
          elastic: "${global_service_name}"
        port:
          fixed: "${port}"
          elastic: "${port}"
      env: {}
      naming: ecs
