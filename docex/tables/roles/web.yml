# Role: web
#
# Canonical core-service role. The project's own services run as
# containers in a docker network on fixed, and as Fargate tasks behind
# an ALB on elastic. See transfer_tables.md § "Walking example: web /
# container" for the spec this is derived from.
#
# The `image:`, `cpu:`, `memory:`, and `tmpfs:` fields are *not* in
# `defaults:` here — they are derived per-service by the compiler from
# `container_registry` + the per-service `resources:` block. See
# cicl.md § Container Registry and transfer_tables.md § Resources
# Translation.

roles:
  web:
    description: "Core-service role — the project's own code, served behind the reverse proxy."
    container:
      foundation: both
      emits:
        fixed: [compose_service]
        elastic: [task_definition, ecs_service, target_group]
      defaults:
        # Routing is network-driven, not role-static: the compiler emits
        # Traefik discovery labels (fixed) and an ALB target group + listener
        # rule (elastic) for ANY service on the `web` network, with
        # per-service subdomains. See networks.md and cicl.md § Domain.
        #
        # The container probe is a DEFAULT, not a field: `health.sh` is
        # emitted for every core service on both foundations and needs
        # nothing from infra.yml but the service's own name. Cadence is
        # doctrine-fixed and uniform across every core service — it is not a
        # project-tunable knob. See healthchecks.md § The orchestrator
        # carries the result.
        fixed:
          healthcheck:
            test: ["CMD", "./health.sh", "${service}"]
            interval: 30s
            timeout: 5s
            retries: 3
        elastic:
          launch_type: FARGATE
          network_mode: awsvpc
          # `CMD`, not `CMD-SHELL`: a command probe needs no shell and no
          # `|| exit 1` exit-code laundering. Exec form on both foundations is
          # what makes the two emissions one translation rather than two
          # adaptations. `./health.sh` resolves against WORKDIR /service,
          # which infrastructure.md § Codebase Containers fixes for every
          # codebase image.
          #
          # `startPeriod` is elastic-only ON PURPOSE, and the reason is a
          # difference between the two orchestrators rather than anything
          # about routing. ECS KILLS a task whose essential container fails
          # its probe and the service replaces it, so a start grace is what
          # prevents a container being killed before it has written its first
          # tick. Docker only REPORTS a status — it restarts nothing of its
          # own accord, and the compiler emits no health-aware traefik labels
          # (only `loadbalancer.server.port`), so on fixed NOTHING reroutes
          # traffic away from an unhealthy container. Per cicl.md rule 33,
          # whether traefik's Docker provider PASSIVELY withholds routing is
          # a property of that tool which this doctrine does not verify: do
          # not rely on it. The fixed probe has exactly two consumers, and
          # neither reroutes: Docker, which reports; and `docex stagetest`,
          # which reads that status and FAILS A RELEASE on it. So there is no
          # wrong consequence for a fixed start grace to prevent — only a
          # `stagetest` gate whose whole job is to notice.
          healthCheck:
            command: ["CMD", "./health.sh", "${service}"]
            interval: 30
            timeout: 5
            retries: 3
            startPeriod: 10
      fields:
        health_check_path:
          # No fixed translation, and NO FIXED CONSUMER AT ALL: the compiler
          # emits no health-aware load-balancer labels on fixed (only
          # `loadbalancer.server.port`), so nothing on that foundation reads
          # this path. Per cicl.md rule 33 the field is still DECLARED here,
          # which is what makes rule 4 accept it in a fixed project's
          # infra.yml and keeps a project portable across foundations. Rule 33
          # requires it on every `web`-network core service on both
          # foundations. A core service's own liveness is the container probe
          # in `defaults` above, never this field.
          elastic:
            target: target_group
            health_check:
              path: ${field_value}
              healthy_threshold: 2
              unhealthy_threshold: 3
              interval: 30
              timeout: 5
      provides:
        host:
          fixed: "${global_service_name}"
          elastic: "${global_service_name}"  # ECS Service Connect resolves this within the env namespace.
        port:
          fixed: "${port}"
          elastic: "${port}"
      env: {}
      # Core service: ECS task/service on elastic, docker container on fixed.
      # ECS accepts both separators; the doctrine prefers underscore.
      naming: ecs
