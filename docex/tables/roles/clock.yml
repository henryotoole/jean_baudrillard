# Role: clock
#
# Core-service role — the singleton cron loop that defers work onto its
# codebase's queue. An ORDINARY long-running core service on both
# foundations, modelled on `worker`:
#
#   - fixed:   one compose service on the codebase's image with the core
#              service's `command`.
#   - elastic: task_definition + ecs_service. NO target_group — a clock
#              takes no ingress (rule 27 forbids `web` in its networks).
#
# `provides.{host,port}` mirrors `worker` DELIBERATELY. A clock is
# consumer-only in practice, but it gets NO exemptions: a magic ref naming
# `api.clock.host` must resolve like any other core service's.
#
# `schedules` is declared below with EMPTY per-foundation translation
# bodies. The declaration is what makes rule 4
# (`tt_rule_4_undeclared_field`) reject `schedules:` on every other role —
# that is how clock.md's "rejected on every other role"
# is enforced, with no new rule. The VALUE is handled procedurally by the
# emitters and is carried directly onto `CompiledService` (see compile.py),
# reaching the container as the `DOCEX_SCHEDULES_YAML` literal on both
# foundations (see emit/schedules.py).
#
# See doctrine/infrastructure/specifics/clock.md for the full spec.
#
# `cpu:`, `memory:`, `tmpfs:` are derived per-core-service by the
# compiler, exactly as for `web`; `image:` is derived per codebase, so
# every core service of a codebase runs one tag.

roles:
  clock:
    description: "Core-service role — the singleton cron loop that defers work onto its codebase's queue."
    container:
      foundation: both
      emits:
        fixed: [compose_service]
        elastic: [task_definition, ecs_service, container_definition]
      defaults:
        # The container probe is a DEFAULT, not a field: `health.sh` is
        # emitted for every core service on both foundations and needs
        # nothing from infra.yml but the service's own name. Cadence is
        # doctrine-fixed and uniform across every core service — it is not a
        # project-tunable knob. See healthchecks.md § The orchestrator
        # carries the result.
        #
        # This is how a clock gets a probe at all. It declares no
        # `health_check_path` — rule 33 confines that field to `web`-network
        # core services, and rule 27 forbids `web` on a clock — so a cron
        # loop's liveness is a loop-tick question, not an HTTP-route one.
        fixed:
          healthcheck:
            test: ["CMD", "./health.sh", "${service}"]
            interval: 30s
            timeout: 5s
            retries: 3
        elastic:
          launch_type: FARGATE
          network_mode: awsvpc
          # `CMD`, not `CMD-SHELL`: a command probe needs no shell and no
          # `|| exit 1` exit-code laundering. Exec form on both foundations is
          # what makes the two emissions one translation rather than two
          # adaptations. `./health.sh` resolves against WORKDIR /service,
          # which infrastructure.md § Codebase Containers fixes for every
          # codebase image.
          #
          # `startPeriod` is elastic-only ON PURPOSE. ECS KILLS a task whose
          # essential container fails its probe and the service replaces it —
          # a wedged cron loop gets the task killed and replaced — so a start
          # grace prevents a container being killed before it has written its
          # first tick. Docker only REPORTS `unhealthy`; nothing on fixed acts
          # on it, so a fixed `start_period` would suppress correct behavior
          # rather than prevent a wrong consequence.
          healthCheck:
            command: ["CMD", "./health.sh", "${service}"]
            interval: 30
            timeout: 5
            retries: 3
            startPeriod: 10
      fields:
        schedules:
          fixed: {}      # consumed procedurally by emit/schedules.py
          elastic: {}    # ditto — one delivery mechanism, both foundations
      provides:
        # A clock that declares a `port` registers as Service-Connect-
        # discoverable on elastic (shape.md § service_discovery), the same as
        # `worker`, which is what lets a consumer holding a magic ref to this
        # clock's `host`/`port` parts actually address it — rule 32's positive
        # arm. Nothing is expected to `uses:` a clock, but nothing structurally
        # prevents it either — no exemptions.
        host:
          fixed: "${global_service_name}"
          elastic: "${global_service_name}"
        port:
          fixed: "${port}"
          elastic: "${port}"
      env: {}
      naming: ecs
