# Role: scheduler
#
# Core service run on a cron schedule (a job), not a long-running
# server. Foundation-aware in mechanism, identical in contract: the
# service declares a `command` and a `schedule`, and docex arranges for
# that command to run, in the project's image, on that schedule, with the
# same resolved env-and-secret surface any core service of that env gets.
#
#   - fixed:   one mcuadros/ofelia container per scheduler service,
#              launching the job as a one-off container on each fire.
#   - elastic: EventBridge Scheduler (aws_scheduler_schedule) -> ECS
#              RunTask on a reused task definition, plus a per-service
#              scheduler-invocation IAM role. NO ecs_service.
#
# See doctrine/infrastructure/specifics/scheduler.md for the full spec.
#
# `schedule` is declared below as a role-specific field so it is a
# recognized field (validation rule 4 rejects it on other roles; `docex
# role scheduler` surfaces it). Its VALUE needs cron translation, which
# is procedural — the compiler special-cases it (see compile.py). The
# per-foundation translation bodies are intentionally empty markers: they
# exist only so the field is *declared* for this engine and so the
# elastic side routes to the `scheduled_task` destination; the actual
# translated value is carried onto the compiled service directly.

roles:
  scheduler:
    description: "Core service run on a cron schedule (a job), not a long-running server."
    container:
      foundation: both
      emits:
        fixed: [compose_service]
        elastic: [task_definition, scheduled_task]   # NO ecs_service, NO target_group
      defaults:
        fixed: {}
        elastic:
          launch_type: FARGATE
          network_mode: awsvpc
      fields:
        schedule:
          fixed: {}                  # consumed by the ofelia emitter (compose)
          elastic:
            target: scheduled_task   # consumed by render_scheduled_task
      provides: {}                   # a scheduler serves nothing; no parts
      env: {}
      # Core service: ECS task on elastic, docker container on fixed.
      # ECS accepts both separators; the doctrine prefers underscore.
      naming: ecs
